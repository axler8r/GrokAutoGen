# https://git-cliff.org/docs/configuration
[bump]
initial_tag = "v0.1.0"
features_always_bump_minor = true
breaking_always_bump_major = true

[changelog]
trim = true
header = """# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}\
    ## {{ version | trim_start_matches(pat="v") }}
    **{{ timestamp | date(format="%Y-%m-%d") }}**
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | unique(attribute="message") | filter(attribute="merge_commit") | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        + {% if commit.breaking %}**!!** {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n

"""
footer = """
"""

postprocessors = [
  # { pattern = '<REPO>', replace = "https://github.com/orhun/git-cliff" }, # replace repository URL
]


[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
  # { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))"}, # replace issue numbers
]
commit_parsers = [
  # increment major version
  { message = "^feat!", group = "<!--0-->Breaking Changes" },
  { message = "^feat: add", group = "<!--0-->Added" },
  { message = "^feat: retire", group = "<!--0-->Retired" },
  # increment minor version
  { message = "^.*: deprecate", group = "<!--1-->Deprecated" },
  { message = "^.*: update", group = "<!--1-->Changed" },
  { message = "^fix.*", group = "<!--1-->Fixed" },
  # increment patch version
  { message = "^hotfix.*", group = "<!--2-->Patched" },
  { message = "^build.*", group = "<!--2-->Changed" },
  { message = "^cicd.*", group = "<!--2-->Changed" },
  { message = "^dep.*", group = "<!--2-->Changed" },
  { message = "^perf.*", group = "<!--2-->Changed"},
  { message = "^sec.*", group = "<!--2-->Changed"},
  # ignore
  { message = "^.*", skip = true },
]
protect_breaking_commits = true
filter_commits = true
# tag_pattern = "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?$"
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(-(alpha|beta)\\.[1-9]+[0-9]*$)?"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
